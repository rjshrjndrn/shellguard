[project]
name = "shellguard"
version = "0.1.0"
description = "Is this shell command dangerous? Small local classifier, CPU only."
authors = [
    { name = "rjshrjndrn", email = "rjshrjndrn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastembed>=0.9.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
]

[project.scripts]
shellguard = "shellguard.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "pytest>=9.1.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]
