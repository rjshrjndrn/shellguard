[project]
name = "shellguard"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "rjshrjndrn", email = "rjshrjndrn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastembed>=0.9.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
shellguard = "shellguard:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
